<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Francis Kienji</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Profile Picture -->
            <div class="profile-section">
                <img src="/images/2025.png" alt="Francis Kienji" class="profile-pic">
                <h1 class="login-title">Admin Login</h1>
                <p class="login-subtitle">Welcome back, Francis</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!-- Success Message -->
            <div id="successMessage" class="success-message" style="display: none;"></div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>Logging in...</p>
            </div>

            <!-- Footer Links -->
            <div class="login-footer">
                <a href="#" class="footer-link" id="forgotPasswordLink">
                    <i class="fas fa-redo"></i> Reset Password
                </a>
                <span class="divider">•</span>
                <a href="access-request.html" class="footer-link">
                    <i class="fas fa-user-plus"></i> Request Access
                </a>
            </div>

            <!-- Divider -->
            <div class="divider-line"></div>

            <!-- Back to Portfolio -->
            <div class="back-to-portfolio">
                <a href="/" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
            </div>
        </div>

        <!-- Background Animation -->
        <div class="background-animation">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
