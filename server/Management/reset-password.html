<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Francis Kienji</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">

            <!-- Header -->
            <div class="profile-section">
                <div style="font-size: 48px; color: #00c853; margin-bottom: 10px;">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="login-title">Set New Password</h1>
                <p class="login-subtitle">Enter your new password below</p>
            </div>

            <!-- Reset Form -->
            <form id="resetPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-lock"></i> New Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword"
                            placeholder="At least 8 characters" required minlength="8">
                        <button type="button" class="toggle-password" id="toggleNew">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Repeat new password" required minlength="8">
                        <button type="button" class="toggle-password" id="toggleConfirm">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Password strength bar -->
                <div style="margin-bottom:12px;">
                    <div id="strengthBar" style="height:5px; border-radius:4px; background:#eee; overflow:hidden;">
                        <div id="strengthFill" style="height:100%; width:0; transition:width 0.3s, background 0.3s;"></div>
                    </div>
                    <small id="strengthLabel" style="color:#888; font-size:11px;"></small>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <i class="fas fa-check-circle"></i> Set New Password
                </button>
            </form>

            <!-- Messages -->
            <div id="errorMessage"   class="error-message"   style="display:none;"></div>
            <div id="successMessage" class="success-message" style="display:none;"></div>
            <div id="loadingSpinner" class="loading-spinner"  style="display:none;">
                <div class="spinner"></div>
                <p>Saving password...</p>
            </div>

            <!-- Invalid / expired token notice (shown when token is bad) -->
            <div id="invalidTokenNotice" style="display:none; text-align:center; margin-top:20px;">
                <p style="color:#dc3545;">This reset link is invalid or has expired.</p>
                <a href="login.html" class="footer-link" style="margin-top:10px; display:inline-block;">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>

            <div class="divider-line"></div>

            <div class="back-to-portfolio">
                <a href="/" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Portfolio
                </a>
            </div>
        </div>

        <div class="background-animation">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5000' : '';

        // ── Grab token from URL ──────────────────────────────────────
        const params  = new URLSearchParams(window.location.search);
        const token   = params.get('token');

        const form           = document.getElementById('resetPasswordForm');
        const errorEl        = document.getElementById('errorMessage');
        const successEl      = document.getElementById('successMessage');
        const spinnerEl      = document.getElementById('loadingSpinner');
        const invalidNotice  = document.getElementById('invalidTokenNotice');
        const submitBtn      = document.getElementById('submitBtn');

        if (!token) {
            form.style.display = 'none';
            invalidNotice.style.display = 'block';
        }

        // ── Password visibility toggles ──────────────────────────────
        function attachToggle(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const inp  = document.getElementById(inputId);
                const icon = document.querySelector(`#${btnId} i`);
                inp.type   = inp.type === 'password' ? 'text' : 'password';
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        }
        attachToggle('toggleNew',     'newPassword');
        attachToggle('toggleConfirm', 'confirmPassword');

        // ── Strength meter ───────────────────────────────────────────
        document.getElementById('newPassword').addEventListener('input', function () {
            const v     = this.value;
            const fill  = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let score   = 0;
            if (v.length >= 8)                        score++;
            if (/[A-Z]/.test(v))                      score++;
            if (/[0-9]/.test(v))                      score++;
            if (/[^A-Za-z0-9]/.test(v))               score++;

            const configs = [
                { w: '0%',   color: '#eee',     text: '' },
                { w: '25%',  color: '#dc3545',  text: 'Weak' },
                { w: '50%',  color: '#ffc107',  text: 'Fair' },
                { w: '75%',  color: '#17a2b8',  text: 'Good' },
                { w: '100%', color: '#00c853',  text: 'Strong' },
            ];
            const cfg = configs[score];
            fill.style.width      = cfg.w;
            fill.style.background = cfg.color;
            label.textContent     = cfg.text;
            label.style.color     = cfg.color;
        });

        // ── Helpers ──────────────────────────────────────────────────
        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
            spinnerEl.style.display = 'none';
            setTimeout(() => { errorEl.style.display = 'none'; }, 6000);
        }
        function showSuccess(msg) {
            successEl.textContent = msg;
            successEl.style.display = 'block';
            errorEl.style.display  = 'none';
            spinnerEl.style.display = 'none';
        }
        function showLoading() {
            spinnerEl.style.display = 'block';
            errorEl.style.display   = 'none';
            successEl.style.display = 'none';
            submitBtn.disabled      = true;
        }
        function hideLoading() {
            spinnerEl.style.display = 'none';
            submitBtn.disabled      = false;
        }

        // ── Form submit ──────────────────────────────────────────────
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPw  = document.getElementById('newPassword').value.trim();
            const confPw = document.getElementById('confirmPassword').value.trim();

            if (newPw.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }
            if (newPw !== confPw) {
                showError('Passwords do not match.');
                return;
            }

            showLoading();

            try {
                const res = await fetch(`${API_BASE}/api/auth/reset-password/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: newPw }),
                });

                const data = await res.json();
                hideLoading();

                if (!res.ok) {
                    if (res.status === 400 && data.error && data.error.toLowerCase().includes('expired')) {
                        form.style.display      = 'none';
                        invalidNotice.style.display = 'block';
                    } else {
                        showError(data.error || 'Failed to reset password. Please try again.');
                    }
                    return;
                }

                showSuccess('✅ Password updated! Redirecting to login...');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);

            } catch (err) {
                hideLoading();
                showError('Network error. Please check your connection.');
            }
        });
    </script>
</body>

</html>
